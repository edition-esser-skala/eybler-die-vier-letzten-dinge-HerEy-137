    notes: "178 fol., 51 × 33.5 cm. Hand-ruled paper, 24 staves per page (8 mm) in dark brown ink and music in same ink. 89 bifolios, numbered in Eybler's hand in the upper right corner of each first page (brown ink: 1–89). In addition, folio numbers have been added by different hand in the upper right corner of every 10th and the last folio (pencil: 10, 20, …, 160, 170, 178). A clean autograph ink fair copy with very few changes. Bound in brown-grey marbled paper with an autograph label: “Vermacht seinem Freund dem k:k: Hofzahlmeiſter, H. Michael v. Barten | schlag, und nach deſſen Tode der k:k: Hofbibliothek Joseph edler von Eybler [manu propria] | [left:] Wien, 1831 [right:] k:k: Hofkapellmeiſter | Die 4 lezten Dinge | Ein Oratorium | in | 3 Abtheilungen. | 810.”. Between the front fly leaf and fol. 1, a hand-written autograph libretto has been inserted: 12 fol., 27.5 x 22.5 cm; brown ink; numbered by different hand in pencil in each upper outer corner with uppercase roman numerals: I, I′, … XII, XII′."
